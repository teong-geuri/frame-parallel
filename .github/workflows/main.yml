name: Build and Release Mod
on:
  push:
    tags:
      - 'v*'

jobs:
  buildJar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Build mod jar
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x ./gradlew
        ./gradlew deploy
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/libs/${{ github.event.repository.name }}.jar
        generate_release_notes: true

